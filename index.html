<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto Karaoke | Menú Principal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0a1c 0%, #1a0b2e 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .logo {
            font-size: 2.5rem;
            color: #00ff66;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 102, 0.5);
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 5px;
            font-weight: 800;
            letter-spacing: 1px;
        }
        p.subtitle {
            color: #a1a1aa;
            margin-bottom: 40px;
            font-size: 1rem;
        }
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .menu-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(30, 20, 50, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px 25px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            text-align: left;
        }
        .menu-btn:hover {
            background: #00ff66;
            color: #000;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 255, 102, 0.2);
        }
        .menu-btn .icon {
            font-size: 1.5rem;
            margin-right: 15px;
        }
        .menu-btn .text {
            flex-grow: 1;
        }
        .arrow {
            font-size: 1.2rem;
            opacity: 0.5;
        }
        .menu-btn:hover .arrow {
            opacity: 1;
            transform: translateX(5px);
        }
    </style>
</head>
<body>

    <div class="logo">🎤</div>
    <h1>Karaoke UPDS</h1>
    <p class="subtitle">Selecciona a dónde quieres ir</p>

    <div class="menu-grid">

            <span class="icon">🏠</span>

            <span class="arrow">→</span>
        </a>

        <!-- Enlace al Avance Semana 3 (Mobile-First) -->

            <span class="icon">📱</span>
            <span class="text">Avance Semana 3: Mobile-First</span>
            <span class="arrow">→</span>
        </a>

        <!-- Enlace al Avance Semana 3 (Componentes) -->

        <!-- Enlace al Avance Semana 3 (Componentes) -->
